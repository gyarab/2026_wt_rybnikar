<!DOCTYPE html>
<html lang="cs" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- BEZ TOHOTO ŘÁDKU RESPONZIVITA NA MOBILU NEFUNGUJE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>

    <!-- Bootstrap 6 (alpha) – CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        /* pomocné orámování krabic, ať vidíme, co se děje */
        .krabice {
            border: 2px dashed rgb(0, 114, 245);
            padding: 1rem;
            min-height: 80px;
        }
    </style>
</head>
<body>

    <!-- Ukazatel aktuálního breakpointu (vpravo dole) -->
    <div class="position-fixed bottom-0 end-0 m-3 badge theme-inverse fs-md">
        <span class="sm:d-none">XS &lt; 576</span>
        <span class="d-none sm:d-inline md:d-none">SM ≥ 576</span>
        <span class="d-none md:d-inline lg:d-none">MD ≥ 768</span>
        <span class="d-none lg:d-inline xl:d-none">LG ≥ 1024</span>
        <span class="d-none xl:d-inline 2xl:d-none">XL ≥ 1280</span>
        <span class="d-none 2xl:d-inline">2XL ≥ 1536</span>
    </div>

    <div class="container">
        <h1 class="my-5">Boxes</h1>

        
    </div>
    <div class="krabice">bez kontejneru</div>
    <div class="container"><div class="krabice">container</div></div>
    <div class="container-fluid"><div class="krabice">container-fluid</div></div>

    <div class ="row row-cols-1 md:row-cols-2 lg:row-cols-3" xl:row-cols-4>
        <div class ="col krabice  g-5">1</div>  
        <div class ="col krabice  g-5">2</div>  
        <div class ="col krabice  g-5">3</div>  
        <div class ="col krabice  g-5">4</div>  
        <div class ="col krabice  g-5">5</div>  
        <div class ="col krabice  g-5">6</div>  
        <div class ="col krabice  g-5">7</div>  
        <div class ="col krabice  g-5">8</div>  
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
